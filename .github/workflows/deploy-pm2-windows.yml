name: Deploy backend-api to D PM2

# FULL OTOMATIS: push ke main -> server D:\itsp-backend langsung update.
# Butuh 1x pasang GitHub Self-Hosted Runner Windows di server (lihat PANDUAN_DEPLOY_D_PM2.md S8b).
# .env di D:\itsp-backend\.env AMAN (di-ignore git, tidak tertimpa reset).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-itsp-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + pip + pm2 restart :8004
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Update D:\itsp-backend dari GitHub
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location D:\itsp-backend

          git config --global --add safe.directory D:/itsp-backend 2>$null
          git config --global --add safe.directory D:\itsp-backend 2>$null
          git config --global --add safe.directory '*' 2>$null

          $extraPaths = @(
            (Join-Path $env:APPDATA "npm"),
            "C:\Users\IT-PLASTECH\AppData\Roaming\npm",
            "C:\Users\Administrator\AppData\Roaming\npm",
            "C:\Program Files\nodejs"
          )
          foreach ($p in $extraPaths) {
            if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) { $env:Path = "$env:Path;$p" }
          }
          if (-not $env:PM2_HOME) {
            if (Test-Path "C:\Users\IT-PLASTECH\.pm2") { $env:PM2_HOME = "C:\Users\IT-PLASTECH\.pm2" }
          }
          $pm2Cmd = (Get-Command pm2.cmd -ErrorAction SilentlyContinue).Source
          if (-not $pm2Cmd) {
            foreach ($p in $extraPaths) {
              $cand = Join-Path $p "pm2.cmd"
              if (Test-Path $cand) { $pm2Cmd = $cand; break }
            }
          }
          if (-not $pm2Cmd) { $pm2Cmd = "pm2" }

          try { Remove-Item -Path .git\FETCH_HEAD -Force -ErrorAction SilentlyContinue } catch {}
          git fetch origin main
          git reset --hard origin/main
          D:\itsp-backend\venv\Scripts\pip.exe install -r requirements.txt
          & $pm2Cmd restart itsp-backend
          & $pm2Cmd save
          & $pm2Cmd list

      - name: Health check :8004
        run: |
          $ErrorActionPreference = "Stop"
          $ok = $false
          for ($i = 1; $i -le 10; $i++) {
            Start-Sleep -Seconds 3
            try {
              $h = Invoke-RestMethod http://localhost:8004/health -TimeoutSec 3
              if ($h.status -eq 'healthy') {
                Write-Host "Health check passed on attempt $i : $($h | ConvertTo-Json -Compress)"
                $ok = $true
                break
              }
            } catch {
              Write-Host "Waiting for :8004 to be ready (attempt $i/10)..."
            }
          }
          if (-not $ok) {
            Write-Error "Backend on port 8004 did not respond healthy in 30s"
          }
